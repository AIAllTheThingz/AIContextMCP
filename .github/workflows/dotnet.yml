name: .NET

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AIContextMCP.slnx
      - run: dotnet build AIContextMCP.slnx --configuration Release --no-restore
      - run: dotnet test AIContextMCP.slnx --configuration Release --no-build
